services:
  db_credit_programs: # создаем контейнер под БД credit-programs
    image: postgres:16
    container_name: db_credit_programs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d credit_programs"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: credit_programs
    ports:
      - "5435:5432"
    networks:
      - monitoring
    volumes:
      - ./db_credit_programs_data:/var/lib/postgresql/data
      - ./db-init/credit_programs:/docker-entrypoint-initdb.d:ro # начальные данные, применяются только на пустую БД

  db_credit_loans: # создаем контейнер под БД credit-loans
    image: postgres:16
    container_name: db_credit_loans
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d credit_loans"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: credit_loans
    ports:
      - "5437:5432"
    networks:
      - monitoring
    volumes:
      - ./db_credit_loans_data:/var/lib/postgresql/data
      - ./db-init/credit_loans:/docker-entrypoint-initdb.d:ro # начальные данные, применяются только на пустую БД

  credit-programs: # создаем контейнер под "сервис/микросервис" для его связки с другими системами + работы с метриками
    build:
      context: ./credit-programs
      dockerfile: docker/build.Dockerfile
    image: credit-programs-image
    container_name: credit-programs
    env_file: ./credit-programs/.env
    environment: # внутри docker-сети БД доступна по имени контейнера и порту 5432
      CREDIT_PROGRAMS_HOST: db_credit_programs
      CREDIT_PROGRAMS_PORT: 5432
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
    ports:
      - "8083:8080"
    networks:
      - monitoring
    depends_on:
      db_credit_programs:
        condition: service_healthy

  credit-loans: # создаем контейнер под "сервис/микросервис" для его связки с другими системами + работы с метриками
    build:
      context: ./credit-loans
      dockerfile: docker/build.Dockerfile
    image: credit-loans-image
    container_name: credit-loans
    env_file: ./credit-loans/.env
    environment: # внутри docker-сети БД доступна по имени контейнера и порту 5432
      CREDIT_LOANS_HOST: db_credit_loans
      CREDIT_LOANS_PORT: 5432
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
    ports:
      - "8082:8080"
    networks:
      - monitoring
    depends_on:
      db_credit_loans:
        condition: service_healthy

  nginx: # выступает в качестве шлюза между пользаком и сервером
    image: nginx:latest
    container_name: nginx_gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - monitoring
    depends_on:
      credit-loans:
        condition: service_healthy

  cadvisor: #собирает метрики с контейнеров
    image: ghcr.io/google/cadvisor:0.60.6
    container_name: cadvisor
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8087:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring
    depends_on:
      - credit-programs
      - credit-loans
      - db_credit_programs
      - db_credit_loans

  node-exporter: # агент сбора метрик
    image: prom/node-exporter:v1.6.1
    container_name: node-exporter
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    ports:
      - "9100:9100"
    networks:
      - monitoring
    depends_on:
      - cadvisor

  prometheus: #собирает метрики с cAdvisor и обрабатывает их
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 40s 
    restart: always
    ports:
      - "9090:9090"
    command: 
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.yml:/etc/prometheus/alerts.yml
    networks:
      - monitoring
    depends_on:
      - cadvisor
      - node-exporter
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9093"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - monitoring   

  grafana: # визуализирует полученные метрики
    image: grafana/grafana:10.0.0
    container_name: grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana-storage:/var/lib/grafana

networks:
  monitoring:
    driver: bridge

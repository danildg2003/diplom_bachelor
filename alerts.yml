groups:
  - name: basic-alerts
    rules:
      # Упавший инстанс
      - alert: InstanceDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is down"
          description: "Instance {{ $labels.job }} ({{ $labels.instance }}) is down for more than 30s."

      # Высокая загрузка CPU
      - alert: HighCPUUsage
        expr: avg(rate(container_cpu_usage_seconds_total{container!=""}[1m])) by (container) > 0.8
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.container }}"
          description: "Container {{ $labels.container }} is using more than 80% CPU."

      # Медленная БД
      - alert: PostgresHighLatency
        expr: rate(pg_stat_activity{state="waiting"}[1m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High DB latency on {{ $labels.instance }}"
          description: "Detected waiting queries on {{ $labels.job }} ({{ $labels.instance }})"

      # Nginx не отвечает
      - alert: NginxUnresponsive
        expr: probe_success{job="nginx_gateway"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Nginx gateway is unresponsive"
          description: "Nginx on {{ $labels.instance }} is not responding to health checks."

      # Высокая нагрузка на диск
      - alert: HighDiskUsage
        expr: node_filesystem_usage{fstype!="", mountpoint!="/"} > 0.9
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage is above 90% on {{ $labels.instance }}"
          description: "Disk usage on {{ $labels.instance }} is greater than 90%."

      # Высокое использование памяти
      - alert: HighMemoryUsage
        expr: (container_memory_usage_bytes{container!="",container!="POD"} / container_spec_memory_limit_bytes{container!="",container!="POD"}) > 0.9
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage is above 90% on {{ $labels.container }}"
          description: "Memory usage on {{ $labels.container }} is greater than 90%."

      # Мало HTTP-запросов
      - alert: LowHTTPRequests
        expr: rate(http_requests_total{job="nginx_gateway", status="2xx"}[5m]) < 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Low HTTP request rate on {{ $labels.instance }}"
          description: "HTTP request rate on {{ $labels.instance }} is below threshold (less than 1 request per minute)."
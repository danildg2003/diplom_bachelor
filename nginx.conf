events {}

http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # DNS докера: адрес контейнера определяется на каждый запрос,
    # иначе после пересоздания контейнера nginx ходит на старый IP
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        set $credit_loans http://credit-loans:8080;

        # Рут перенаправляет на API
        location = / {
            return 301 /api/;
        }

        # Проксируем основной API
        location /api/ {
            proxy_pass $credit_loans;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Проксируем метрики
        location /metrics {
            rewrite ^/metrics$ /api/metrics break;
            proxy_pass $credit_loans;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
